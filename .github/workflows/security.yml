name: Security Scan & Secret Leak Detection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Public Repository Secret Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Leak Guard (Working Tree & Commit Diff)
        run: |
          echo "Scanning current working tree and event commit diff for exposed private credentials and server secrets..."
          
          # SEC-01-FIX-07-R1 (D4):
          # - Scans 100% of application source files including src/lib/firebase.ts (never globally excluded).
          # - Public client Firebase Web API key identifier (AIzaSy...) is not treated as a private server secret.
          # - Covers PEM/RSA/EC/OPENSSH/DSA private keys, Stripe live keys, GitHub classic & fine-grained PATs,
          #   Slack tokens, AWS access keys, and private Paddle API / webhook notification secrets.
          LEAKS_FOUND=0
          
          PATTERNS=(
            "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
            "sk_live_[0-9a-zA-Z]{24,}"
            "ghp_[0-9a-zA-Z]{36}"
            "github_pat_[0-9a-zA-Z_]{22,}"
            "xox[baprs]-[0-9a-zA-Z]{10,48}"
            "AKIA[0-9A-Z]{16}"
            "pdl_ntfset_[0-9a-zA-Z_]{16,}"
            "pdl_live_apikey_[0-9a-zA-Z_]{16,}"
            "pdl_sdbx_apikey_[0-9a-zA-Z_]{16,}"
            "sb_secret_[0-9a-zA-Z_-]{8,}"
            "sbp_[0-9a-zA-Z]{20,}"
            "VITE_SUPABASE_SECRET_KEY"
            "VITE_SUPABASE_SERVICE_ROLE_KEY"
          )
          
          # 1. Deterministic scan of current working tree (HEAD), including all test files
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -E -I -n -e "$PATTERN" -- ':!*.example' ':!dist/**' ':!.github/workflows/security.yml' || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Potential secret leak detected in working tree matching pattern: $PATTERN"
              echo "$MATCHES"
              LEAKS_FOUND=1
            fi
          done
          
          # 2. Deterministic scan of added lines in commit diff for push / pull_request
          DIFF_RANGE=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="${{ github.event.before }}..${{ github.sha }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_RANGE="HEAD~1..HEAD"
          fi
          
          if [ -n "$DIFF_RANGE" ]; then
            echo "Scanning commit diff range: $DIFF_RANGE"
            ADDED_LINES=$(git diff "$DIFF_RANGE" -- ':!*.example' ':!dist/**' ':!.github/workflows/security.yml' | grep -E -- '^\+[^+]' || true)
            if [ -n "$ADDED_LINES" ]; then
              for PATTERN in "${PATTERNS[@]}"; do
                DIFF_MATCHES=$(printf "%s\n" "$ADDED_LINES" | grep -E -- "$PATTERN" || true)
                if [ -n "$DIFF_MATCHES" ]; then
                  echo "::error::Potential secret leak detected in commit diff ($DIFF_RANGE) matching pattern: $PATTERN"
                  LEAKS_FOUND=1
                fi
              done
            fi
          fi
          
          if [ $LEAKS_FOUND -ne 0 ]; then
            echo "Security scan FAILED: Private secrets detected in repository!"
            exit 1
          fi
          
          echo "Security scan PASSED: No exposed private secrets detected."

      - name: Setup Node.js for Build Output Secret Verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies & Build Frontend Bundle
        run: |
          npm ci
          npm run build

      - name: Verify Zero Server Secrets in Built dist/ Bundle (MIG-01-FIX-02)
        run: |
          echo "Scanning built dist/ artifacts for any leaked server secrets or sb_secret_ keys..."
          if [ ! -d "dist" ]; then
            echo "::error::dist/ directory missing after npm run build"
            exit 1
          fi

          DIST_LEAKS=0
          DIST_PATTERNS=(
            "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
            "sb_secret_[0-9a-zA-Z_-]{8,}"
            "sbp_[0-9a-zA-Z]{20,}"
            "SUPABASE_SECRET_KEY"
            "SUPABASE_SERVICE_ROLE_KEY"
            "pdl_ntfset_[0-9a-zA-Z_]{16,}"
            "pdl_live_apikey_[0-9a-zA-Z_]{16,}"
            "pdl_sdbx_apikey_[0-9a-zA-Z_]{16,}"
          )

          for PATTERN in "${DIST_PATTERNS[@]}"; do
            MATCHES=$(grep -rnE -- "$PATTERN" dist/ || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Secret pattern leaked into dist/ bundle: $PATTERN"
              DIST_LEAKS=1
            fi
          done

          if [ $DIST_LEAKS -ne 0 ]; then
            echo "dist/ bundle security verification FAILED!"
            exit 1
          fi

          echo "dist/ bundle security verification PASSED: Zero secrets in build output."
