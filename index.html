<!doctype html>
<html lang="en" style="background-color: #020617;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plateforme CAO / DAO Isométrie et Tuyauterie Industrielle ORTHOGONAL - ENG avec éditeur 2D/3D, calculs de métré, génération BOM et traçage AutoCAD." />
    <meta property="og:title" content="PD&I — Piping Design & Isometrics" />
    <meta property="og:description" content="Plateforme CAO / DAO Isométrie et Tuyauterie Industrielle ORTHOGONAL - ENG avec éditeur 2D/3D, calculs de métré, génération BOM et traçage AutoCAD." />
    <title>PD&I — Piping Design & Isometrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #020617 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #020617;
      }
      #root:empty::after {
        content: "Chargement du PD&I...";
        font-size: 13px;
        font-weight: 800;
        color: #fb923c; /* orange-400 */
        letter-spacing: 0.15em;
        text-transform: uppercase;
        animation: pulse-animation 1.5s infinite;
      }
      @keyframes pulse-animation {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
    <!-- PATCH 017G : CSS critique en ligne. Sert d ossature minimale quand le
         bundle Tailwind n est pas livre. N inclut volontairement aucune classe
         utilitaire Tailwind (dont .hidden) pour ne pas fausser la sonde 017D. -->
    <style id="pdi-critical-017g">
      #root { min-height: 100vh; }
      html.pdi-no-tailwind body {
        background: #020617;
        color: #E5EDF8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html.pdi-no-tailwind .pdi-unified-root {
        display: grid;
        grid-template-rows: 72px 40px 1fr;
        min-height: 100vh;
      }
      html.pdi-no-tailwind .pdi-unified-topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: #060B14;
        border-bottom: 1px solid rgba(103, 232, 249, 0.25);
      }
      html.pdi-no-tailwind .pdi-tabsbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #0B111A;
        border-bottom: 1px solid rgba(103, 232, 249, 0.2);
        overflow-x: auto;
      }
      html.pdi-no-tailwind .pdi-content {
        padding: 16px;
        overflow: auto;
      }
      html.pdi-no-tailwind button,
      html.pdi-no-tailwind .pdi-start-primary {
        min-height: 30px;
        padding: 6px 12px;
        border-radius: 10px;
        border: 1px solid rgba(103, 232, 249, 0.45);
        background: #0F172A;
        color: #E5EDF8;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      html.pdi-no-tailwind input,
      html.pdi-no-tailwind select {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0B111A;
        color: #E5EDF8;
      }
      html.pdi-no-tailwind svg { width: 18px; height: 18px; }
      html.pdi-no-tailwind #pdi-style-alert {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 8px 12px;
        background: #7C2D12;
        color: #FFEDD5;
        font-size: 12px;
        font-weight: 800;
      }
    </style>
  </head>
  <body style="background-color: #020617;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
